name: Release to staging

# Coolify can't deploy tags directly, so a version tag (vX.Y.Z) moves the
# `staging` pointer-branch to the tagged commit; Coolify (tracking `staging`)
# then auto-deploys it. See technology-and-infrastructure ADR-001/ADR-002.
on:
  push:
    tags:
      - "v*"

jobs:
  point-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The version served by /api/version is the first line of CHANGELOG.md,
      # written by changelog-generator.sh in a release PR before tagging, so a
      # tag that disagrees with it, or has no notes, is a mistake.
      - name: Check CHANGELOG.md starts with the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          first=$(head -1 CHANGELOG.md)
          case "$first" in
            "# $TAG - "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *)
              echo "::error::CHANGELOG.md must start with '# $TAG - YYYY-MM-DD', found '$first'"
              exit 1 ;;
          esac
          notes=$(sed -n '2,/^# /p' CHANGELOG.md | grep -v '^# ' | grep -c '[^[:space:]]' || true)
          if [ "$notes" -eq 0 ]; then
            echo "::error::CHANGELOG.md has no notes under $TAG"
            exit 1
          fi
      # HEAD is the tagged commit; force-move `staging` to it.
      - name: Point staging at ${{ github.ref_name }}
        run: |
          echo "Pointing staging -> ${GITHUB_REF_NAME} ($(git rev-parse --short HEAD))"
          git push --force origin "HEAD:refs/heads/staging"
