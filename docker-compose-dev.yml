# This file can be used as a means to override the front-end's exposed
# port when running locally.
# Publishes the FE port which Coolify must not do
#
# Set these in your .env file:
#
#     COMPOSE_FILE=docker-compose.yml:docker-compose-dev.yml
#     EXPOSE_PORT=8000
#     MAPTILER_API_KEY=<your key>
#
# then build and run with `docker compose up -d --build` as normal, and
# the app is on http://localhost:8000/?datasetId=dataset-A (DATASETS is
# unset so the bundled test datasets are used)
#
# Credit: https://frankwiles.com/til/easy-compose-overrides/

services:
  front-end:
    ports:
      - "127.0.0.1:${EXPOSE_PORT:-8000}:80"
