# Deployment stack for Coolify. See docs/coolify.md.
#
# Coolify builds every service from the repo root, supplies the environment
#  variables below from its dashboard and routes domains through its own
#  proxy, so no host ports are published here (publishing one would bypass
#  the proxy and its HTTPS). ${VAR:?} is required and fails the deploy when
#  unset, ${VAR:-} is optional.
#
# To run locally see docker-compose-dev.yml
#
# ${SERVICE_NAME_<SVC>} are Coolify magic variables giving the real compose
#  service name, which is suffixed -pr-N in PR previews, and ${SOURCE_COMMIT}
#  is the commit being deployed, reported by /api/version. The :- fallbacks
#  keep plain docker compose working
#
# No container_name and no custom network: fixed names collide when Coolify
#  runs PR previews next to the main stack, and a second network gives each
#  container two addresses, one of which Coolify's proxy cannot reach

name: mykomap

services:
  # Fills the data volume from the cwm-test-data repo, or with the bundled
  #  test datasets when DATASETS is empty, before the BE is update
  # Restarts on every deploy - so redeploy to get new data
  # See docker/datasets/fetch-datasets.sh for the variables
  datasets:
    build:
      context: .
      dockerfile: docker/datasets/Dockerfile
    environment:
      DATASETS: ${DATASETS:-}
      DATA_REPO_URL: ${DATA_REPO_URL:-}
      DATA_REPO_REF: ${DATA_REPO_REF:-master}
    volumes:
      - data:/data
    restart: "no"

  # The Mykomap API on port 3000 under /api, reading datasets from
  #  /data/datasets/*. NODE_VERSION is the major version from .tool-versions
  back-end:
    build:
      context: .
      dockerfile: apps/back-end/Dockerfile
      args:
        NODE_VERSION: "22"
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    environment:
      # GlitchTip error reporting, off when unset. The environment tags
      # errors as dev, staging or production
      GLITCHTIP_KEY: ${BE_GLITCHTIP_KEY:-}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-}
      # Space separated origins allowed to call the API from other sites,
      # * for any. Unset means same origin only
      FASTIFY_CORS_ORIGIN: ${FASTIFY_CORS_ORIGIN:-}
    volumes:
      - data:/data:ro
    depends_on:
      datasets:
        condition: service_completed_successfully
    restart: unless-stopped

  # Caddy serving the built front-end on port 80 and proxying /api/* to the
  #  back-end. The settings below are read at start and served as /config.js,
  #  see apps/front-end/public/config.js for what each one does
  front-end:
    build:
      context: .
      dockerfile: apps/front-end/Dockerfile
      args:
        NODE_VERSION: "22"
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    environment:
      API_UPSTREAM: ${SERVICE_NAME_BACK_END:-back-end}:3000
      MAPTILER_API_KEY: ${MAPTILER_API_KEY:?MapTiler key for the base map}
      GLITCHTIP_KEY: ${FE_GLITCHTIP_KEY:-}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-}
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_ID: ${UMAMI_ID:-}
      UMAMI_RECORDER_URL: ${UMAMI_RECORDER_URL:-}
      MIXPANEL_TOKEN: ${MIXPANEL_TOKEN:-}
      MIXPANEL_SESSION_RECORDING_PERCENT: ${MIXPANEL_SESSION_RECORDING_PERCENT:-}
    depends_on:
      - back-end
    restart: unless-stopped

volumes:
  # The cwm-test-data checkout, with the datasets under datasets/
  data:
